name: CD

# Deploys the single, self-contained Next.js app to Google Cloud Run on a v* tag.
#
# The app is now one service: API routes + the baked dataset live inside it, so
# there is no separate Java API, no Postgres, no Amadeus, and no NEXT_PUBLIC_API_URL
# build arg. (The legacy api/ and worker/ remain in the repo for reference but are
# not built or deployed here.) An even simpler path is Vercel — `vercel --prod`
# from web/ — since there is no cold-start DB to worry about.

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build & push web image
        run: |
          IMAGE=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-app/web:${{ github.ref_name }}
          docker build -t "$IMAGE" ./web
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: travel-web
          image: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travel-app/web:${{ github.ref_name }}
          region: europe-west1
