# The product is now the single Next.js app in web/ — it has no database and no
# external API dependency, so `docker compose up` builds and runs just that.
#
#   docker compose up --build            → the live app at http://localhost:3000
#   docker compose --profile legacy up   → the ORIGINAL Java API + Postgres +
#                                           Python worker stack, kept for reference
#                                           (needs the legacy vars in .env).
services:
  web:
    build:
      context: ./web
    ports:
      - "3000:3000"

  # ---- Legacy reference stack (not started by default) ---------------------
  # The original Spring Boot API, its Postgres, and the Python ETL worker. These
  # are preserved to show where the project started; the TS app replaced them.
  db:
    image: postgres:15-alpine
    profiles: ["legacy"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    profiles: ["legacy"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AMADEUS_CLIENT_ID: ${AMADEUS_CLIENT_ID}
      AMADEUS_CLIENT_SECRET: ${AMADEUS_CLIENT_SECRET}
      AMADEUS_API_URL: ${AMADEUS_API_URL}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    profiles: ["legacy"]
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
